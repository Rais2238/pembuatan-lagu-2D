<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Art Video Visualizer</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for monospace feel -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Fira Code', monospace;
            background-color: #030712;
            color: #f3f4f6;
            overflow-x: hidden;
        }

        /* Glowing text effects */
        .glow-green {
            text-shadow: 0 0 8px rgba(34, 197, 94, 0.8), 0 0 16px rgba(34, 197, 94, 0.4);
            color: #4ade80;
        }

        .glow-pink {
            text-shadow: 0 0 8px rgba(236, 72, 153, 0.8), 0 0 16px rgba(236, 72, 153, 0.4);
            color: #f472b6;
        }

        .glow-red {
            text-shadow: 0 0 8px rgba(239, 68, 68, 0.8), 0 0 16px rgba(239, 68, 68, 0.4);
            color: #f87171;
        }

        .glow-white {
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.8), 0 0 16px rgba(255, 255, 255, 0.3);
            color: #ffffff;
        }

        /* CRT Screen scanline overlay effect */
        .scanlines {
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.25) 50%
            ), linear-gradient(
                90deg,
                rgba(255, 0, 0, 0.03),
                rgba(0, 255, 0, 0.01),
                rgba(0, 0, 255, 0.03)
            );
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #111827;
        }
        ::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #4b5563;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-gray-950 text-gray-100">

    <!-- Header -->
    <header class="border-b border-gray-800 bg-gray-900/80 backdrop-blur px-6 py-4 flex flex-wrap justify-between items-center z-10 gap-4">
        <div class="flex items-center space-x-3">
            <div class="w-3 h-3 rounded-full bg-red-500 animate-pulse"></div>
            <h1 class="text-xl font-bold tracking-wider text-green-400 uppercase">ASCII Visualizer Terminal</h1>
        </div>
        <div class="flex items-center space-x-4 text-xs text-gray-400">
            <span>MODE: <span id="currentModeDisplay" class="text-white font-bold">LYRIC SHOWCASE</span></span>
            <span>FPS: <span id="fpsDisplay" class="text-green-400 font-mono">60</span></span>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-4 p-4 lg:p-6 overflow-hidden max-w-[1920px] mx-auto w-full">
        
        <!-- Visualizer Screen Container (Left/Main Panel) -->
        <section class="lg:col-span-8 flex flex-col bg-black rounded-xl border border-gray-800 relative overflow-hidden shadow-2xl min-h-[450px] lg:min-h-[600px]">
            <!-- CRT Scanline overlay -->
            <div class="absolute inset-0 scanlines z-10 opacity-70"></div>

            <!-- Screen Top Bar -->
            <div class="bg-gray-900/90 border-b border-gray-800 px-4 py-2 flex justify-between items-center z-20 text-xs text-gray-400">
                <div class="flex items-center space-x-2">
                    <span class="inline-block w-2.5 h-2.5 rounded-full bg-red-500"></span>
                    <span class="inline-block w-2.5 h-2.5 rounded-full bg-yellow-500"></span>
                    <span class="inline-block w-2.5 h-2.5 rounded-full bg-green-500"></span>
                    <span class="ml-2 font-mono text-gray-300">ASCII_RENDER_OUTPUT.TXT</span>
                </div>
                <div class="flex items-center space-x-3">
                    <button id="fullscreenBtn" class="hover:text-white transition">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>
                    </button>
                </div>
            </div>

            <!-- ASCII Canvas Container -->
            <div class="relative flex-1 flex items-center justify-center p-2 bg-black overflow-hidden" id="canvasWrapper">
                <canvas id="asciiCanvas" class="max-w-full max-h-full block object-contain"></canvas>
            </div>

            <!-- Quick Player Control Bar -->
            <div class="bg-gray-900/90 border-t border-gray-800 p-4 z-20 flex flex-col gap-3">
                <div class="flex items-center gap-3">
                    <button id="playPauseBtn" class="bg-green-600 hover:bg-green-500 text-black font-bold px-5 py-2 rounded-lg transition flex items-center gap-2 text-sm">
                        <span id="playIcon">▶ Play</span>
                    </button>
                    <button id="resetBtn" class="bg-gray-800 hover:bg-gray-700 text-gray-200 px-4 py-2 rounded-lg transition text-sm">
                        ↺ Restart
                    </button>

                    <!-- Timeline slider -->
                    <div class="flex-1 flex items-center gap-2">
                        <span id="currentTime" class="text-xs font-mono text-gray-400">00:00</span>
                        <input type="range" id="timeSlider" min="0" max="100" value="0" step="0.1" class="w-full accent-green-500 bg-gray-800 h-1.5 rounded-lg appearance-none cursor-pointer">
                        <span id="durationTime" class="text-xs font-mono text-gray-400">00:00</span>
                    </div>

                    <!-- Volume Control -->
                    <div class="flex items-center gap-2 border-l border-gray-800 pl-3">
                        <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path></svg>
                        <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.8" class="w-16 sm:w-20 accent-green-500 bg-gray-800 h-1.5 rounded-lg appearance-none cursor-pointer">
                    </div>
                </div>
            </div>
        </section>

        <!-- Controls & Configuration Panel (Right Panel) -->
        <section class="lg:col-span-4 flex flex-col gap-4 overflow-y-auto max-h-[85vh]">
            
            <!-- Mode Switcher Tabs -->
            <div class="bg-gray-900 p-1.5 rounded-xl border border-gray-800 grid grid-cols-2 gap-1 text-xs font-semibold">
                <button id="tabTextMode" class="py-2 rounded-lg bg-gray-800 text-green-400 transition shadow">Lyrics & Sequence</button>
                <button id="tabMediaMode" class="py-2 rounded-lg text-gray-400 hover:text-white transition">Video / Webcam</button>
            </div>

            <!-- Panel 1: Lyric Sequences Controls & Audio Settings -->
            <div id="panelTextMode" class="bg-gray-900 border border-gray-800 rounded-xl p-4 flex flex-col gap-4">
                <h3 class="text-sm font-bold text-gray-300 uppercase tracking-wider flex items-center justify-between">
                    <span>Lyric Presets & Audio</span>
                    <span class="text-xs font-normal text-gray-500">Bleachers - Christmas Scene</span>
                </h3>

                <div>
                    <label class="text-xs text-gray-400 block mb-1">Audio Source</label>
                    <div class="flex flex-col gap-2">
                        <input type="file" id="audioFileInput" accept="audio/*" class="text-xs text-gray-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:bg-gray-800 file:text-green-400 hover:file:bg-gray-700 cursor-pointer w-full">
                        <div class="flex gap-2">
                            <input type="text" id="audioUrlInput" placeholder="Paste Audio URL (.mp3 / .wav)" class="flex-1 bg-gray-950 border border-gray-800 rounded-lg p-2 text-xs text-gray-200 focus:outline-none focus:border-green-500 font-mono">
                            <button id="loadAudioUrlBtn" class="bg-gray-800 hover:bg-gray-700 text-xs text-green-400 px-3 rounded-lg border border-gray-700 transition">Load</button>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="text-xs text-gray-400 block mb-1">Preset Themes</label>
                    <select id="presetSelect" class="w-full bg-gray-950 border border-gray-800 rounded-lg p-2 text-xs text-gray-200 focus:outline-none focus:border-green-500">
                        <option value="christmas">Bleachers - Merry Christmas Please Don't Call</option>
                        <option value="matrix">Matrix Code Stream</option>
                        <option value="custom">Custom Text Sequence</option>
                    </select>
                </div>

                <div>
                    <label class="text-xs text-gray-400 block mb-1">Edit Sequence JSON (Time in sec & Text/Icon)</label>
                    <textarea id="lyricEditor" class="w-full h-36 bg-gray-950 border border-gray-800 rounded-lg p-2 font-mono text-xs text-green-400 focus:outline-none focus:border-green-500 leading-relaxed resize-none" spellcheck="false"></textarea>
                </div>
                <button id="applyLyricsBtn" class="w-full bg-gray-800 hover:bg-gray-700 text-xs font-semibold py-2 rounded-lg border border-gray-700 text-green-400 transition">
                    Apply Sequence Changes
                </button>
            </div>

            <!-- Panel 2: Video/Webcam Controls (Hidden by default) -->
            <div id="panelMediaMode" class="bg-gray-900 border border-gray-800 rounded-xl p-4 flex-col gap-4 hidden">
                <h3 class="text-sm font-bold text-gray-300 uppercase tracking-wider">Media Input Settings</h3>
                
                <div class="flex flex-col gap-2">
                    <label class="text-xs text-gray-400">Upload Video File</label>
                    <input type="file" id="videoFileInput" accept="video/*" class="text-xs text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:bg-gray-800 file:text-green-400 hover:file:bg-gray-700 cursor-pointer">
                </div>

                <div class="relative flex py-1 items-center">
                    <div class="flex-grow border-t border-gray-800"></div>
                    <span class="flex-shrink mx-2 text-xs text-gray-500">OR</span>
                    <div class="flex-grow border-t border-gray-800"></div>
                </div>

                <button id="webcamBtn" class="w-full bg-gray-800 hover:bg-gray-700 text-xs font-semibold py-2.5 rounded-lg border border-gray-700 text-gray-200 transition flex items-center justify-center gap-2">
                    <svg class="w-4 h-4 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                    Enable Camera Feed
                </button>
            </div>

            <!-- Panel 3: Style & ASCII Rendering Customization -->
            <div class="bg-gray-900 border border-gray-800 rounded-xl p-4 flex flex-col gap-4">
                <h3 class="text-sm font-bold text-gray-300 uppercase tracking-wider">Visual Customization</h3>

                <!-- Color Theme Options -->
                <div>
                    <label class="text-xs text-gray-400 block mb-2">Glow Color Style</label>
                    <div class="grid grid-cols-4 gap-2">
                        <button data-color="glow-green" class="color-picker-btn py-1.5 rounded border border-green-500 bg-green-950/40 text-green-400 text-xs font-bold text-center">Green</button>
                        <button data-color="glow-pink" class="color-picker-btn py-1.5 rounded border border-gray-800 bg-gray-950 text-gray-400 text-xs font-bold text-center">Pink</button>
                        <button data-color="glow-red" class="color-picker-btn py-1.5 rounded border border-gray-800 bg-gray-950 text-gray-400 text-xs font-bold text-center">Red</button>
                        <button data-color="glow-white" class="color-picker-btn py-1.5 rounded border border-gray-800 bg-gray-950 text-gray-400 text-xs font-bold text-center">White</button>
                    </div>
                </div>

                <!-- Font Size Slider -->
                <div>
                    <div class="flex justify-between text-xs text-gray-400 mb-1">
                        <span>Resolution / Font Size</span>
                        <span id="fontSizeVal">12px</span>
                    </div>
                    <input type="range" id="fontSizeSlider" min="8" max="24" value="12" class="w-full accent-green-500 bg-gray-800 h-1.5 rounded-lg appearance-none cursor-pointer">
                </div>

                <!-- Contrast / Brightness Sliders -->
                <div>
                    <div class="flex justify-between text-xs text-gray-400 mb-1">
                        <span>Contrast / Density</span>
                        <span id="contrastVal">1.2</span>
                    </div>
                    <input type="range" id="contrastSlider" min="0.5" max="3" step="0.1" value="1.2" class="w-full accent-green-500 bg-gray-800 h-1.5 rounded-lg appearance-none cursor-pointer">
                </div>

                <!-- Invert toggle -->
                <div class="flex items-center justify-between pt-1">
                    <span class="text-xs text-gray-400">Invert Luminance</span>
                    <input type="checkbox" id="invertToggle" class="w-4 h-4 accent-green-500 rounded bg-gray-950 border-gray-800">
                </div>
            </div>

        </section>
    </main>

    <!-- Hidden media elements for processing -->
    <video id="hiddenVideo" class="hidden" playsinline loop></video>
    <audio id="audioPlayer" class="hidden" preload="auto"></audio>

    <script>
        // Default Lyrics sequence inspired by TikTok video (Bleachers song)
        const PRESET_SEQUENCE = [
            { time: 0, text: "MERRY CHRISTMAS\nPLEASE DONT CALL" },
            { time: 2, text: "But You\nShould Know" },
            { time: 5, text: "That I\nDied Slow" },
            { time: 7, text: "Running Through\nThe Halls" },
            { time: 9, text: "Of Your\nHaunted Home" },
            { time: 11, text: "And The\nToughest Part" },
            { time: 14, text: "Is That We\nBoth Know" },
            { time: 16, text: "What Happened\nTo You" },
            { time: 18, text: "Why You're Out\nOn Your Own" },
            { time: 21, text: "Merry Christmas\nPlease Dont Call" },
            { time: 25, text: "Merry Christmas\nI'm Not Yours\nAt All" },
            { time: 30, text: "Merry Christmas\nPlease Dont Call" },
            { time: 32, icon: "PHONE" }, // Custom phone graphic
            { time: 37, text: "BLEACHERS" }
        ];

        const MATRIX_SEQUENCE = [
            { time: 0, text: "SYSTEM ONLINE\nWAKE UP NEO..." },
            { time: 4, text: "THE MATRIX HAS YOU..." },
            { time: 8, text: "FOLLOW THE\nWHITE RABBIT." },
            { time: 12, text: "KNOCK, KNOCK." }
        ];

        // ASCII character ramp from darkest to brightest
        const DENSITY_RAMP = " .':-i|_+=a8@#WM";

        // Application State
        let isPlaying = false;
        let currentTime = 0;
        let lastTimestamp = 0;
        let activeMode = 'text'; // 'text' or 'media'
        let lyricData = [...PRESET_SEQUENCE];
        let duration = 48; // default duration in seconds
        let currentColorStyle = 'glow-green';
        let fontSize = 12;
        let contrast = 1.2;
        let invertLuminance = false;
        let animationFrameId = null;

        const canvas = document.getElementById('asciiCanvas');
        const ctx = canvas.getContext('2d');
        const canvasWrapper = document.getElementById('canvasWrapper');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const playIcon = document.getElementById('playIcon');
        const resetBtn = document.getElementById('resetBtn');
        const timeSlider = document.getElementById('timeSlider');
        const volumeSlider = document.getElementById('volumeSlider');
        const currentTimeEl = document.getElementById('currentTime');
        const durationTimeEl = document.getElementById('durationTime');
        const lyricEditor = document.getElementById('lyricEditor');
        const presetSelect = document.getElementById('presetSelect');
        const applyLyricsBtn = document.getElementById('applyLyricsBtn');
        const tabTextMode = document.getElementById('tabTextMode');
        const tabMediaMode = document.getElementById('tabMediaMode');
        const panelTextMode = document.getElementById('panelTextMode');
        const panelMediaMode = document.getElementById('panelMediaMode');
        const videoFileInput = document.getElementById('videoFileInput');
        const webcamBtn = document.getElementById('webcamBtn');
        const hiddenVideo = document.getElementById('hiddenVideo');
        const audioPlayer = document.getElementById('audioPlayer');
        const audioFileInput = document.getElementById('audioFileInput');
        const audioUrlInput = document.getElementById('audioUrlInput');
        const loadAudioUrlBtn = document.getElementById('loadAudioUrlBtn');
        const fontSizeSlider = document.getElementById('fontSizeSlider');
        const fontSizeVal = document.getElementById('fontSizeVal');
        const contrastSlider = document.getElementById('contrastSlider');
        const contrastVal = document.getElementById('contrastVal');
        const invertToggle = document.getElementById('invertToggle');
        const colorPickerBtns = document.querySelectorAll('.color-picker-btn');
        const currentModeDisplay = document.getElementById('currentModeDisplay');
        const fpsDisplay = document.getElementById('fpsDisplay');

        // Offscreen canvas for sampling rendering
        const sampleCanvas = document.createElement('canvas');
        const sampleCtx = sampleCanvas.getContext('2d', { willReadFrequently: true });

        function init() {
            // Set initial JSON in editor
            lyricEditor.value = JSON.stringify(lyricData, null, 2);
            updateDuration();

            // Set up resize observer to keep canvas sharp
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            // Setup UI Events
            setupEvents();

            // Start Animation Loop
            requestAnimationFrame(renderLoop);
        }

        function setupEvents() {
            // Playback controls
            playPauseBtn.addEventListener('click', togglePlay);
            resetBtn.addEventListener('click', () => {
                currentTime = 0;
                timeSlider.value = 0;
                if (audioPlayer.src) audioPlayer.currentTime = 0;
                if (hiddenVideo.src) hiddenVideo.currentTime = 0;
            });

            timeSlider.addEventListener('input', (e) => {
                currentTime = (parseFloat(e.target.value) / 100) * duration;
                if (audioPlayer.src && activeMode === 'text') {
                    audioPlayer.currentTime = currentTime;
                }
                if (hiddenVideo.src && activeMode === 'media') {
                    hiddenVideo.currentTime = currentTime;
                }
            });

            volumeSlider.addEventListener('input', (e) => {
                audioPlayer.volume = parseFloat(e.target.value);
            });

            // Audio File & URL input listeners
            audioFileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    const url = URL.createObjectURL(file);
                    loadAudioSource(url);
                }
            });

            loadAudioUrlBtn.addEventListener('click', () => {
                const url = audioUrlInput.value.trim();
                if (url) {
                    loadAudioSource(url);
                }
            });

            audioPlayer.addEventListener('loadedmetadata', () => {
                if (audioPlayer.duration && !isNaN(audioPlayer.duration)) {
                    duration = audioPlayer.duration;
                }
            });

            audioPlayer.addEventListener('ended', () => {
                isPlaying = false;
                playIcon.textContent = "▶ Play";
            });

            // Tabs
            tabTextMode.addEventListener('click', () => switchMode('text'));
            tabMediaMode.addEventListener('click', () => switchMode('media'));

            // Presets & Lyrics
            presetSelect.addEventListener('change', (e) => {
                if (e.target.value === 'christmas') lyricData = [...PRESET_SEQUENCE];
                if (e.target.value === 'matrix') lyricData = [...MATRIX_SEQUENCE];
                lyricEditor.value = JSON.stringify(lyricData, null, 2);
                updateDuration();
            });

            applyLyricsBtn.addEventListener('click', () => {
                try {
                    const parsed = JSON.parse(lyricEditor.value);
                    if (Array.isArray(parsed)) {
                        lyricData = parsed;
                        updateDuration();
                    }
                } catch (err) {
                    console.error('Invalid JSON format in Lyric Editor!');
                }
            });

            // Color buttons
            colorPickerBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    colorPickerBtns.forEach(b => {
                        b.classList.remove('border-green-500', 'border-pink-500', 'border-red-500', 'border-white');
                        b.classList.add('border-gray-800');
                    });
                    currentColorStyle = btn.dataset.color;
                    btn.classList.remove('border-gray-800');
                    btn.classList.add('border-green-500');
                });
            });

            // Sliders
            fontSizeSlider.addEventListener('input', (e) => {
                fontSize = parseInt(e.target.value);
                fontSizeVal.textContent = `${fontSize}px`;
                resizeCanvas();
            });

            contrastSlider.addEventListener('input', (e) => {
                contrast = parseFloat(e.target.value);
                contrastVal.textContent = contrast;
            });

            invertToggle.addEventListener('change', (e) => {
                invertLuminance = e.target.checked;
            });

            // File upload & webcam
            videoFileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    const url = URL.createObjectURL(file);
                    hiddenVideo.src = url;
                    hiddenVideo.onloadedmetadata = () => {
                        duration = hiddenVideo.duration;
                        switchMode('media');
                    };
                }
            });

            webcamBtn.addEventListener('click', async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    hiddenVideo.srcObject = stream;
                    hiddenVideo.play();
                    duration = 9999;
                    switchMode('media');
                } catch (err) {
                    console.error('Unable to access camera: ', err);
                }
            });

            // Fullscreen
            document.getElementById('fullscreenBtn').addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    canvasWrapper.requestFullscreen().catch(err => console.error(err));
                } else {
                    document.exitFullscreen();
                }
            });
        }

        function loadAudioSource(url) {
            audioPlayer.src = url;
            audioPlayer.load();
            audioPlayer.play().then(() => {
                isPlaying = true;
                playIcon.textContent = "⏸ Pause";
            }).catch(() => {
                // Autoplay restriction fallback
                isPlaying = false;
                playIcon.textContent = "▶ Play";
            });
        }

        function resizeCanvas() {
            const rect = canvasWrapper.getBoundingClientRect();
            canvas.width = rect.width || 800;
            canvas.height = rect.height || 500;
        }

        function switchMode(mode) {
            activeMode = mode;
            currentModeDisplay.textContent = mode === 'text' ? 'LYRIC SHOWCASE' : 'MEDIA INPUT';
            if (mode === 'text') {
                tabTextMode.className = "py-2 rounded-lg bg-gray-800 text-green-400 transition shadow";
                tabMediaMode.className = "py-2 rounded-lg text-gray-400 hover:text-white transition";
                panelTextMode.classList.remove('hidden');
                panelMediaMode.classList.add('hidden');
                if (hiddenVideo.src) hiddenVideo.pause();
            } else {
                tabMediaMode.className = "py-2 rounded-lg bg-gray-800 text-green-400 transition shadow";
                tabTextMode.className = "py-2 rounded-lg text-gray-400 hover:text-white transition";
                panelMediaMode.classList.remove('hidden');
                panelTextMode.classList.add('hidden');
                if (audioPlayer.src) audioPlayer.pause();
            }
        }

        function togglePlay() {
            isPlaying = !isPlaying;
            playIcon.textContent = isPlaying ? "⏸ Pause" : "▶ Play";
            
            if (activeMode === 'text') {
                if (audioPlayer.src) {
                    isPlaying ? audioPlayer.play() : audioPlayer.pause();
                }
            } else if (activeMode === 'media') {
                if (hiddenVideo.src) {
                    isPlaying ? hiddenVideo.play() : hiddenVideo.pause();
                }
            }
        }

        function updateDuration() {
            if (audioPlayer.src && audioPlayer.duration && !isNaN(audioPlayer.duration)) {
                duration = audioPlayer.duration;
            } else if (lyricData.length > 0) {
                const lastItem = lyricData[lyricData.length - 1];
                duration = (lastItem.time || 0) + 5;
            }
        }

        function formatTime(sec) {
            const m = Math.floor(sec / 60).toString().padStart(2, '0');
            const s = Math.floor(sec % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        // Main Animation Loop
        let frameCount = 0;
        let lastFpsUpdate = 0;

        function renderLoop(timestamp) {
            if (!lastTimestamp) lastTimestamp = timestamp;
            const delta = (timestamp - lastTimestamp) / 1000;
            lastTimestamp = timestamp;

            // Calculate FPS
            frameCount++;
            if (timestamp - lastFpsUpdate >= 1000) {
                fpsDisplay.textContent = frameCount;
                frameCount = 0;
                lastFpsUpdate = timestamp;
            }

            // Update Time if playing
            if (isPlaying) {
                if (activeMode === 'text' && audioPlayer.src && !audioPlayer.paused) {
                    currentTime = audioPlayer.currentTime;
                } else if (activeMode === 'media' && hiddenVideo.src) {
                    currentTime = hiddenVideo.currentTime;
                } else {
                    currentTime += delta;
                    if (currentTime >= duration) {
                        currentTime = 0;
                    }
                }
            }

            // Update UI slider
            timeSlider.value = (currentTime / duration) * 100 || 0;
            currentTimeEl.textContent = formatTime(currentTime);
            durationTimeEl.textContent = formatTime(duration);

            // Clear Main Canvas
            ctx.fillStyle = '#030712';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Render current frame to sample canvas
            const columns = Math.floor(canvas.width / (fontSize * 0.6));
            const rows = Math.floor(canvas.height / fontSize);

            if (columns > 0 && rows > 0) {
                sampleCanvas.width = columns;
                sampleCanvas.height = rows;

                sampleCtx.fillStyle = '#000000';
                sampleCtx.fillRect(0, 0, columns, rows);

                if (activeMode === 'text') {
                    renderTextToSampleCtx(columns, rows);
                } else {
                    renderMediaToSampleCtx(columns, rows);
                }

                // Draw ASCII characters from sample pixels
                drawAsciiFrame(columns, rows);
            }

            requestAnimationFrame(renderLoop);
        }

        function renderTextToSampleCtx(cols, rows) {
            // Find current active item from lyric sequence
            let currentItem = null;
            for (let i = lyricData.length - 1; i >= 0; i--) {
                if (currentTime >= lyricData[i].time) {
                    currentItem = lyricData[i];
                    break;
                }
            }

            if (!currentItem) return;

            sampleCtx.fillStyle = '#FFFFFF';
            sampleCtx.textAlign = 'center';
            sampleCtx.textBaseline = 'middle';

            if (currentItem.icon === 'PHONE') {
                // Draw dynamic ASCII Telephone Icon
                const cx = cols / 2;
                const cy = rows / 2;
                const scale = Math.min(cols, rows) / 25;

                sampleCtx.lineWidth = 2 * scale;
                sampleCtx.strokeStyle = '#FFFFFF';

                // Phone body path
                sampleCtx.beginPath();
                sampleCtx.arc(cx - 2 * scale, cy, 6 * scale, 0.4 * Math.PI, 1.6 * Math.PI, false);
                sampleCtx.stroke();

                // Sound waves pulsating
                const waveOffset = (Math.floor(currentTime * 4) % 3) * scale;
                sampleCtx.beginPath();
                sampleCtx.arc(cx + 2 * scale, cy, (4 * scale) + waveOffset, -0.3 * Math.PI, 0.3 * Math.PI, false);
                sampleCtx.stroke();

            } else if (currentItem.text) {
                const lines = currentItem.text.split('\n');
                const fontHeight = Math.floor(rows / (lines.length + 2));
                sampleCtx.font = `bold ${Math.max( fontHeight, 6 )}px sans-serif`;

                const startY = rows / 2 - ((lines.length - 1) * fontHeight) / 2;
                lines.forEach((line, idx) => {
                    sampleCtx.fillText(line, cols / 2, startY + (idx * fontHeight));
                });
            }
        }

        function renderMediaToSampleCtx(cols, rows) {
            if (hiddenVideo.readyState >= 2) {
                sampleCtx.drawImage(hiddenVideo, 0, 0, cols, rows);
            } else {
                sampleCtx.fillStyle = '#FFFFFF';
                sampleCtx.font = '8px sans-serif';
                sampleCtx.textAlign = 'center';
                sampleCtx.fillText("NO MEDIA DETECTED", cols / 2, rows / 2);
            }
        }

        function drawAsciiFrame(cols, rows) {
            const imgData = sampleCtx.getImageData(0, 0, cols, rows).data;
            
            // Map glowing style to hex colors
            let mainColor = '#4ade80';
            let shadowColor = 'rgba(34, 197, 94, 0.6)';

            if (currentColorStyle === 'glow-pink') {
                mainColor = '#f472b6';
                shadowColor = 'rgba(236, 72, 153, 0.6)';
            } else if (currentColorStyle === 'glow-red') {
                mainColor = '#f87171';
                shadowColor = 'rgba(239, 68, 68, 0.6)';
            } else if (currentColorStyle === 'glow-white') {
                mainColor = '#ffffff';
                shadowColor = 'rgba(255, 255, 255, 0.5)';
            }

            ctx.font = `${fontSize}px 'Fira Code', monospace`;
            ctx.fillStyle = mainColor;
            ctx.shadowColor = shadowColor;
            ctx.shadowBlur = 6;

            const charWidth = canvas.width / cols;
            const charHeight = canvas.height / rows;

            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    const idx = (y * cols + x) * 4;
                    const r = imgData[idx];
                    const g = imgData[idx + 1];
                    const b = imgData[idx + 2];

                    // Luminance calculation with contrast adjustment
                    let brightness = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
                    brightness = Math.pow(brightness, contrast);

                    if (invertLuminance) brightness = 1 - brightness;

                    brightness = Math.max(0, Math.min(1, brightness));

                    // Choose ASCII character based on brightness
                    const charIdx = Math.floor(brightness * (DENSITY_RAMP.length - 1));
                    const char = DENSITY_RAMP[charIdx];

                    if (char && char !== ' ') {
                        ctx.fillText(char, x * charWidth, y * charHeight + fontSize);
                    }
                }
            }
            
            // Reset shadow blur to avoid performance penalty on non-text elements
            ctx.shadowBlur = 0;
        }

        // Initialize App on DOM Ready
        window.addEventListener('DOMContentLoaded', init);
    </script>
